name: ptp_app
description: "Pitch To Picture — submit your film script, build your team, pitch on the show."
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_selector: ^1.0.3
  firebase_core: ^4.11.0
  firebase_messaging: ^16.7.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  image_picker: ^1.2.3
  share_plus: ^13.3.1
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo_mark.png
    - assets/branding/sponsor_gsjpl.png
    - assets/branding/ads_banner.png

  # Website type: Cinzel (headlines) + Inter (body). Variable fonts; weights via FontVariation in theme.dart.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
